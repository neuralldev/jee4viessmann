<div class="cmd cmd-widget #history# #hideCmdName# tooltips" data-type="info" data-subtype="numeric"
     data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqlogic_id="#eqLogic_id#"
     style="#style#;#hideCmd#">
  <span class="title" style="display:block;text-align:center;">
    <span class="cmdName">#name_display#</span>
  </span>
  <div id="jee4v-thermo-#uid#" class="jee4v-thermo" data-min="#min#" data-max="#max#"
       style="display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:6px 0;">
    <div class="jee4v-thermo-tube" style="position:relative;width:18px;height:90px;border-radius:9px 9px 0 0;
         border:2px solid #888;border-bottom:none;background:rgba(127,127,127,.15);overflow:hidden;">
      <div class="jee4v-thermo-fill" style="position:absolute;bottom:0;left:0;right:0;height:0%;
           background:#3b82f6;transition:height .4s,background .4s;"></div>
    </div>
    <div class="jee4v-thermo-bulb" style="width:26px;height:26px;border-radius:50%;border:2px solid #888;
         margin-left:-22px;margin-bottom:-2px;background:#3b82f6;transition:background .4s;
         position:relative;z-index:1;"></div>
    <span style="font-size:1.4em;font-weight:600;margin-left:4px;">
      <span class="cmdValue">#state#</span>#unite#
    </span>
  </div>
  <script>
  (function () {
    var root = document.getElementById('jee4v-thermo-#uid#');
    if (!root || root.dataset.jee4vInit) return;
    root.dataset.jee4vInit = '1';
    var fill = root.querySelector('.jee4v-thermo-fill');
    var bulb = root.querySelector('.jee4v-thermo-bulb');
    var valEl = root.querySelector('.cmdValue');
    var min = parseFloat(root.dataset.min); if (isNaN(min)) min = 0;
    var max = parseFloat(root.dataset.max); if (isNaN(max)) max = 80;
    function color(p) {                       // p dans [0,1] : bleu froid -> rouge chaud
      var hue = 220 - 220 * p;                // 220 (bleu) -> 0 (rouge)
      return 'hsl(' + hue + ',75%,52%)';
    }
    function render() {
      var t = parseFloat(String(valEl.textContent || '').replace(',', '.'));
      if (isNaN(t)) return;
      var p = Math.min(1, Math.max(0, (t - min) / (max - min)));
      var c = color(p);
      fill.style.height = (p * 100) + '%';
      fill.style.background = c;
      bulb.style.background = c;
    }
    render();
    new MutationObserver(render).observe(valEl, { childList: true, characterData: true, subtree: true });
  })();
  </script>
</div>
