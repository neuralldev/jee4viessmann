<div class="cmd cmd-widget jee4v-thermo #history#" data-type="info" data-subtype="numeric" data-template="thermometre"
     data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#">
  <div class="title #hide_name#"><div class="cmdName">#name_display#</div></div>
  <div class="content" style="display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:6px 0;">
    <div style="position:relative;width:16px;height:80px;border:2px solid #888;border-bottom:none;
         border-radius:8px 8px 0 0;overflow:hidden;background:rgba(127,127,127,.15);">
      <div class="jee4v-fill" style="position:absolute;bottom:0;left:0;right:0;height:0;
           background:#3b82f6;transition:height .4s,background .4s;"></div>
    </div>
    <div class="jee4v-bulb" style="width:22px;height:22px;border-radius:50%;border:2px solid #888;
         margin-left:-20px;background:#3b82f6;transition:background .4s;"></div>
    <div class="state" style="margin-left:6px;">
      <span class="value" style="font-size:1.3em;font-weight:600;"></span> <span class="unit"></span>
    </div>
  </div>
  <div class="timeCmd label label-default #history#" data-type="info"></div>
  <template>
    <div>time : duration|date ({{Affiche durée ou date de la valeur}})</div>
  </template>
  <script>
    jeedom.cmd.addUpdateFunction('#id#', function (_options) {
      var cmd = document.querySelector('.cmd[data-cmd_uid="#uid#"]');
      if (!is_object(cmd)) return;
      cmd.querySelectorAll('.content, .state').forEach(function (e) {
        e.setAttribute('title', '{{Date de valeur}}: ' + _options.valueDate + '<br>{{Date de collecte}}: ' + _options.collectDate)
      })
      if ('#time#' == 'duration' || '#time#' == 'date') {
        jeedom.cmd.displayDuration(_options.valueDate, cmd.querySelector('.timeCmd'), '#time#')
      }
      if (is_numeric(_options.value)) {
        var min = parseFloat('#minValue#'); if (isNaN(min)) min = 0;
        var max = parseFloat('#maxValue#'); if (isNaN(max)) max = 80;
        var p = Math.min(1, Math.max(0, (parseFloat(_options.value) - min) / (max - min)));
        var col = 'hsl(' + (210 - 150 * p) + ',85%,52%)';   // bleu froid -> rouge chaud
        cmd.querySelector('.jee4v-fill').style.height = (p * 100) + '%';
        cmd.querySelector('.jee4v-fill').style.background = col;
        cmd.querySelector('.jee4v-bulb').style.background = col;
        cmd.querySelector('.value').innerHTML = _options.display_value;
        cmd.querySelector('.unit').innerHTML = _options.unit;
      } else {
        cmd.querySelector('.value').innerHTML = '<span class="label label-danger">' + _options.value + '</span>';
      }
    })

    jeedom.cmd.refreshValue([{ cmd_id: '#id#', value: '#value#', display_value: '#state#',
      valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#', unit: '#unite#' }])
  </script>
</div>
